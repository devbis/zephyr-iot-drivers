# SPDX-License-Identifier: Apache-2.0

description: Transmit-only software UART used as a printk/stdout console

compatible: "iotdrv,soft-uart-console"

include: base.yaml

properties:
  gpios:
    type: phandle-array
    required: true
    description: GPIO used as the UART TX output

  current-speed:
    type: int
    required: true
    description: UART baud rate
