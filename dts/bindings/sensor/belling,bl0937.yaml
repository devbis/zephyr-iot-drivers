# SPDX-License-Identifier: Apache-2.0

description: |
  BL0937 single-phase energy metering IC read by counting pulses: CF is
  proportional to active power, CF1 to current or voltage depending on the
  SEL pin. The driver counts both on GPIO interrupts and flips SEL.

  The defaults are the TS011F reference board values.

    meter {
        compatible = "belling,bl0937";
        cf-gpios = <&gpiod 4 GPIO_ACTIVE_HIGH>;
        cf1-gpios = <&gpiod 5 GPIO_ACTIVE_HIGH>;
        sel-gpios = <&gpiod 6 GPIO_ACTIVE_HIGH>;
        sel-high-is-voltage;
    };

compatible: "belling,bl0937"

include: sensor-device.yaml

properties:
  cf-gpios:
    type: phandle-array
    required: true
    description: CF pulse output, counted on its active edge.

  cf1-gpios:
    type: phandle-array
    required: true
    description: CF1 pulse output, counted on its active edge.

  sel-gpios:
    type: phandle-array
    required: true
    description: |
      SEL input of the chip. Which level selects voltage is given by
      `sel-high-is-voltage`.

  sel-high-is-voltage:
    type: boolean
    description: |
      SEL high makes CF1 carry voltage. Leave unset on boards where SEL high
      selects current.

  shunt-micro-ohms:
    type: int
    default: 1000
    description: Current shunt resistance in micro-ohms.

  voltage-divider-milli:
    type: int
    default: 2351000
    description: Voltage divider ratio (mains to chip pin) times 1000.

  cf-pulses-per-kwh:
    type: int
    default: 3200
    description: CF pulses per kilowatt-hour, used for the energy total.

  current-noise-floor-milliamps:
    type: int
    default: 0
    description: Current at or below this is reported as zero.

  voltage-mv-per-mhz:
    type: array
    description: |
      Voltage scale measured on the product: <numerator denominator> of the millivolts per
      millihertz of CF1 in the voltage mode. When it is given, voltage-divider-milli is not
      used for the voltage. Stock firmware of the Zbeacon TS011F: <110 861>
      (5 V at 39.136364 Hz, that is 0.1278 V/Hz: 230 V at 1.8 kHz).

  current-ma-per-mhz:
    type: array
    description: |
      Current scale measured on the product: <numerator denominator> of the milliamperes per
      millihertz of CF1 in the current mode. When it is given, shunt-micro-ohms is not used for
      the current. Zbeacon TS011F: <99 8000> (200 mA at 16.161616 Hz, 12.375 mA/Hz).

  power-mw-per-mhz:
    type: array
    description: |
      Power scale measured on the product: <numerator denominator> of the milliwatts per
      millihertz of CF. When it is given, neither shunt-micro-ohms nor voltage-divider-milli is
      used for the power. Zbeacon TS011F: <436 285> (36 W at 23.532110 Hz, 1.5298 W/Hz).
